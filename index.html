<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bruce or Batman?</title>
    <link rel="stylesheet" href="cs.css">
</head>
<body>
    <div class="bg-bulb">
        <img id="bulb_img" src="photos/off.jpeg" class="bulb_off" alt="Light bulb">
    </div>

    <div class="switch" aria-label="Light switch">
        <div class="btn" role="button" tabindex="0" aria-label="Toggle the light"></div>
        <span class="bruce_status">ON</span>
        <span class="bruce_batman">OFF</span>
    </div>

    <audio src="photos/im-batman.mp3" id="audio" preload="auto"></audio>
    <audio src="photos/sound-hum.mp3" id="light_hum" preload="auto"></audio>

    <script src="jas.js"></script>
</body>
</html>
